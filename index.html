<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FISIOEXERCISE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D5C53">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FISIOEXERCISE">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: barra superiore con schede; esercizi = colonna filtri + griglia; scheda = blocchi esercizio impilati con tabella di progressione */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#15211F; --muted:#566763; --line:#D4DDDA;
  --accent:#0D5C53; --accent-ink:#FFFFFF; --accent-soft:#DCEDE9; --warn:#A8452A; --warn-soft:#F7E6DF;
  --chip:#E6ECEA; --shadow:0 1px 2px rgba(10,40,35,.06),0 4px 14px rgba(10,40,35,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#171F1E; --ink:#E4ECEA; --muted:#93A4A0; --line:#2B3735;
  --accent:#5FC3B3; --accent-ink:#0B1F1C; --accent-soft:#1B3330; --warn:#E58C6C; --warn-soft:#3A221B;
  --chip:#222C2A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#171F1E; --ink:#E4ECEA; --muted:#93A4A0; --line:#2B3735;
  --accent:#5FC3B3; --accent-ink:#0B1F1C; --accent-soft:#1B3330; --warn:#E58C6C; --warn-soft:#3A221B;
  --chip:#222C2A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}

main.wrap{padding-block:20px 60px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Esercizi */
.lib{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.lib{grid-template-columns:minmax(0,1fr)}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:860px){.filters{position:static}}
.filters h2{font-size:16px}
.filters .two{display:grid;grid-template-columns:1fr;gap:10px}
@media (max-width:860px) and (min-width:520px){.filters .two{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lib-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lib-head h1{font-size:26px;margin-right:auto}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:3/2;background:var(--chip);display:block;width:100%;border:0;padding:0;max-width:100%}
.card .ph img,.card .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px}
.alias{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--ink)}
.chip.k{background:var(--accent-soft)}
.chip.g{background:var(--warn-soft)}
.card .ft{display:flex;gap:6px;padding:0 12px 12px}
.card .ft .btn{flex:1;justify-content:center}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* Dialog */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,18,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:22px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pair img,.pair svg{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;background:var(--chip);display:block}
.pair figcaption{font-size:12px;color:var(--muted)}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 16px;font-size:13px}
.tags dt{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tags dd{margin:0}
.sec h4{font-size:14px;margin-bottom:6px}
.sec ul{margin:0;padding-left:20px}
.sec.err h4{color:var(--warn)}
.ref{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:700}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.edit-grid,.pair{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px}
.checks label{display:flex;gap:4px;align-items:center;font-size:14px}

/* Scheda */
.sheet-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:2fr 1fr 2fr;gap:12px}
.sheet-head .full{grid-column:1/-1}
@media (max-width:720px){.sheet-head{grid-template-columns:1fr}}
.sheet-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.sheet-bar h1{font-size:26px;margin-right:auto}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.ex-top{display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:760px){.ex-top{grid-template-columns:minmax(0,1fr)}}
.ex-top .pair{grid-template-columns:1fr}
.ex-top .pair figure:nth-child(2){display:none}
.ex-num{font-family:var(--f-display);color:var(--accent);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ex-ctrl{display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.ex-ctrl{flex-direction:row}}
.ex-desc{font-size:14px;color:var(--ink);margin:6px 0 0}
.ex-cue{margin:6px 0 0;padding-left:18px;font-size:14px}
.prog-ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:14px}
.prog-ctrl select,.prog-ctrl input[type=number]{width:auto;padding:4px 8px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:13px}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto}
table.prog{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
table.prog th,table.prog td{border:1px solid var(--line);padding:0;text-align:left}
table.prog thead th{background:var(--accent-soft);font-size:13px;padding:6px 8px}
table.prog tbody th{font-size:13px;padding:6px 8px;width:160px;background:var(--bg);font-weight:700}
table.prog input{border:0;border-radius:0;background:transparent;padding:7px 8px;width:100%;min-width:80px}
table.prog input:focus{background:var(--accent-soft);outline:none}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:20px;font-size:14px}
.legend h3{font-size:16px;margin-bottom:8px}
.legend table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.legend td,.legend th{border-bottom:1px solid var(--line);padding:4px 12px 4px 0;text-align:left;vertical-align:top}

/* Archivio / impostazioni */
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.li .t{margin-right:auto;min-width:0}
.li .t b{display:block}
.li .t span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.panel+.panel{margin-top:16px}
.logo-prev{max-height:70px;max-width:240px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.note{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:calc(100vw - 32px)}

/* ---------- STAMPA / PDF ---------- */
#print-root{display:none}
body.preview #app-ui{display:none}
body.preview #print-root{display:block;background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:14mm 12mm;box-shadow:var(--shadow)}
body.preview .preview-bar{display:flex}
.preview-bar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;gap:8px;justify-content:center;padding:10px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pr{font:10.5pt/1.4 var(--f-body);color:#111}
.pr h1,.pr h2,.pr h3{color:#0D5C53}
.pr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #0D5C53;padding-bottom:8px;margin-bottom:10px}
.pr-logo img{max-height:22mm;max-width:70mm;object-fit:contain}
.pr-logo .txt{font-family:var(--f-display);font-size:20pt;font-weight:700;color:#0D5C53}
.pr-studio{text-align:right;font-size:9pt;color:#444;white-space:pre-line}
.pr-paz{display:grid;grid-template-columns:2fr 1fr;gap:4px 16px;margin-bottom:8px}
.pr-paz div span{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:#666}
.pr-paz div b{font-size:11pt}
.pr-note{margin:4px 0 8px;white-space:pre-line}
.pr-ex{break-inside:avoid;page-break-inside:avoid;border-top:1px solid #ccd;padding-top:8px;margin-top:10px}
.pr-ex h2{font-size:13pt;display:flex;gap:8px;align-items:baseline}
.pr-ex h2 small{font-family:var(--f-body);font-weight:400;font-size:9pt;color:#555}
.pr-ex .n{display:inline-block;width:6mm;height:6mm;border-radius:50%;background:#0D5C53;color:#fff;font-size:9pt;text-align:center;line-height:6mm;flex:none}
.pr-body{display:grid;grid-template-columns:62mm 1fr;gap:5mm;margin-top:4px}
.pr-imgs{display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.pr-imgs.one{grid-template-columns:1fr}
.pr-imgs img,.pr-imgs svg{width:100%;aspect-ratio:3/2;object-fit:cover;border:1px solid #ddd;border-radius:2mm;display:block}
.pr-body p{margin:0 0 3px}
.pr-body h4{font-size:9pt;margin:4px 0 1px;color:#0D5C53;text-transform:uppercase;letter-spacing:.05em}
.pr-body ul{margin:0;padding-left:14px}
.pr-tab{border-collapse:collapse;width:100%;margin-top:5px;font-size:9pt;font-variant-numeric:tabular-nums}
.pr-tab th,.pr-tab td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
.pr-tab thead th{background:#E3F0ED}
.pr-tab tbody th{background:#F4F6F6;width:30mm}
.pr-exnote{font-style:italic;margin-top:3px}
.pr-legend{break-inside:avoid;margin-top:12px;border-top:2px solid #0D5C53;padding-top:6px;font-size:8.5pt;display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.pr-legend table{border-collapse:collapse}
.pr-legend td{padding:1px 6px 1px 0;vertical-align:top}
.pr-foot{margin-top:8px;font-size:7.5pt;color:#777}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  body::before{display:none}
  #app-ui,.preview-bar,.toast,dialog{display:none!important}
  #print-root{display:block!important;padding:0!important;box-shadow:none!important;max-width:none!important}
  :root{color-scheme:light}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>
</head>
<body>
<div class="preview-bar">
  <button class="btn primary" data-act="stampa">Stampa / salva PDF</button>
  <button class="btn" data-act="chiudi-anteprima">Torna alla scheda</button>
</div>
<div id="app-ui">
  <header class="top"><div class="wrap">
    <div class="brand"><b>FISIOEXERCISE</b><span id="brand-name">NC Fisioterapia</span></div>
    <button class="btn sm primary" id="installa" data-act="installa" hidden>Installa app</button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="esercizi" aria-selected="true">Esercizi</button>
      <button class="tab" role="tab" data-tab="scheda" aria-selected="false">Scheda<span class="badge" id="badge">0</span></button>
      <button class="tab" role="tab" data-tab="archivio" aria-selected="false">Archivio</button>
      <button class="tab" role="tab" data-tab="impostazioni" aria-selected="false">Impostazioni</button>
    </nav>
  </div></header>
  <main class="wrap" id="view"></main>
</div>
<div id="print-root"></div>
<dialog id="dlg"></dialog>
<datalist id="dl-serie"><option value="3×10"><option value="3×8"><option value="4×6"><option value="5×5"><option value="3×12"><option value="3×15"><option value="5×30 s"><option value="4×45 s"><option value="3×10 per lato"></datalist>
<datalist id="dl-carico"><option value="Corpo libero"><option value="Elastico giallo"><option value="Elastico rosso"><option value="Elastico verde"><option value="Elastico blu"><option value="Elastico nero"><option value="Elastico argento"><option value="Elastico oro"><option value="60% 1RM"><option value="70% 1RM"><option value="75% 1RM"><option value="80% 1RM"><option value="85% 1RM"></datalist>
<datalist id="dl-rpe"><option value="RPE 5-6 · RIR 4-6"><option value="RPE 7 · RIR 3"><option value="RPE 7.5 · RIR 2-3"><option value="RPE 8 · RIR 2"><option value="RPE 8.5 · RIR 1-2"><option value="RPE 9 · RIR 1"><option value="RPE 10 · RIR 0"></datalist>
<datalist id="dl-tempo"><option value="3-1-1-0"><option value="4-0-1-0"><option value="3-0-X-0"><option value="2-2-2-0"><option value="5-0-1-0"><option value="Isometria"></datalist>
<datalist id="dl-recupero"><option value="45 s"><option value="60 s"><option value="90 s"><option value="2 min"><option value="3 min"></datalist>
<script src="esercizi.js"></script>
<script src="esercizi-anca.js"></script>
<script src="esercizi-cervicale.js"></script>
<script src="esercizi-toracico.js"></script>
<script src="esercizi-lombare.js"></script>
<script src="esercizi-spalla.js"></script>
<script src="esercizi-gomito.js"></script>
<script src="esercizi-polso-mano.js"></script>
<script src="esercizi-ginocchio.js"></script>
<script src="esercizi-piede-caviglia.js"></script>
<script src="app.js"></script>
</body>
</html>
